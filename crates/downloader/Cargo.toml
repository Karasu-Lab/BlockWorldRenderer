[package]
name = "downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
resourcepack = { version = "0.1.0", path = "../resourcepack" }
serializer = { version = "0.1.0", path = "../serializer" }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
thiserror = "2.0.21"

[features]
cli = ["dep:clap", "dep:clap_complete"]
