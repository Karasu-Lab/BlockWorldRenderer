[package]
name = "thread"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.21"

# The browser has no `std::thread`: its workers are Web Workers sharing one wasm
# memory, which wasm-bindgen-rayon starts as a rayon pool.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = "1"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
