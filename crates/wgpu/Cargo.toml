[package]
name = "wgpu"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
block = { version = "0.1.0", path = "../block", optional = true }
camera = { version = "0.1.0", path = "../camera", optional = true }
debugger = { version = "0.1.0", path = "../debugger", optional = true }
renderer = { version = "0.1.0", path = "../renderer", optional = true }
resourcepack = { version = "0.1.0", path = "../resourcepack", optional = true }
shader = { version = "0.1.0", path = "../shader", optional = true }
bytemuck = { version = "1", optional = true }
naga = { version = "30", optional = true, features = ["wgsl-in", "wgsl-out"] }
raw-window-handle = { version = "0.6", optional = true }
thiserror = "2.0.21"
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "HtmlCanvasElement", "WebGl2RenderingContext", "Window", "console"] }

[features]
default = []
backend = [
    "dep:block",
    "dep:camera",
    "dep:debugger",
    "dep:renderer",
    "dep:resourcepack",
    "dep:shader",
    "dep:bytemuck",
    "dep:naga",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:wgpu",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
