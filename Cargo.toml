[workspace]
members = [".", "crates/*"]
exclude = ["third_party"]
resolver = "3"

[package]
name = "block-world-renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bwr-core = { version = "0.1.0", path = "crates/core" }
# Pinned to the wasm-bindgen-cli version provided by flake.nix,
# because the CLI only accepts the exact schema version it was built for.
wasm-bindgen = "=0.2.129"
