[workspace]
members = ["crates/*"]
exclude = ["third_party"]
resolver = "3"

[package]
name = "block-world-renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "core", version = "0.1.0", path = "crates/core", features = ["canvas", "debugger", "renderer", "resourcepack", "settings", "shader", "thread", "ui", "wgpu", "worldgen"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3.34"
js-sys = "0.3.106"
pomme-client = { path = "third_party/Client/pomme-client", default-features = false, features = ["wgpu", "steel-world"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-web = "=0.1.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]

[patch.crates-io]
azalea-buf = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-protocol = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-crypto = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-auth = { path = "third_party/Client/third_party/vendor/azalea-auth" }
azalea-entity = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-block = { path = "third_party/Client/pomme-block" }
azalea-chat = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-core = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-registry = { path = "third_party/Client/third_party/vendor/azalea-registry" }
azalea-inventory = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
simdnbt = { path = "third_party/Client/third_party/SteelMC/vendor/simdnbt" }
saa = { path = "third_party/Client/third_party/vendor/saa" }

[patch."https://github.com/azalea-rs/azalea"]
azalea-auth = { path = "third_party/Client/third_party/vendor/azalea-auth" }
azalea-block = { path = "third_party/Client/pomme-block" }
azalea-registry = { path = "third_party/Client/third_party/vendor/azalea-registry" }
