name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test and build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace patches point into the Client submodule, so every
          # cargo command needs it checked out.
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Lint
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint the downloader CLI
        run: nix develop -c cargo clippy -p downloader --all-targets --features cli -- -D warnings

      - name: Test
        run: nix develop -c cargo test --workspace

      - name: Test the downloader CLI
        run: nix develop -c cargo test -p downloader --features cli

      - name: Build core without features
        run: nix develop -c cargo build -p core --no-default-features

      - name: Build core with all features
        run: nix develop -c cargo build -p core --all-features

      - name: Install web dependencies
        run: nix develop -c pnpm --dir apps/web install --frozen-lockfile

      - name: Build the WebAssembly package and copy it into the web app
        run: nix develop -c just web-wasm

      - name: Upload WebAssembly package
        uses: actions/upload-artifact@v4
        with:
          name: block-world-renderer-wasm
          path: pkg/
          if-no-files-found: error

      - name: Lint the web app
        run: nix develop -c pnpm --dir apps/web run lint

      - name: Type-check the web app
        run: nix develop -c pnpm --dir apps/web run typecheck

      - name: Build the web app
        run: nix develop -c pnpm --dir apps/web run build
