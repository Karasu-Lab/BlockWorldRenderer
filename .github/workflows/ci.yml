name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace patches point into the Client submodule, so every
          # cargo command needs it checked out.
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rust-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ hashFiles('flake.lock') }}-

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Lint
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint the downloader CLI
        run: nix develop -c cargo clippy -p downloader --all-targets --features cli -- -D warnings

      - name: Test
        run: nix develop -c cargo test --workspace

      - name: Test the downloader CLI
        run: nix develop -c cargo test -p downloader --features cli

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Separate key from the Rust job's: this build compiles for
      # wasm32 with its own flags, so the two target trees differ.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ hashFiles('flake.lock') }}-

      - name: Build the WebAssembly package
        run: nix develop -c just web-wasm

      # The release job below publishes this exact build as a
      # GitHub Release on main.
      - name: Save the WebAssembly package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: pkg

  release:
    name: Release
    needs: wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the WebAssembly package
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg

      # The web app downloads the package from the latest release at
      # runtime (apps/web/app/wasm-package.tsx), so the site build
      # does not depend on a release existing. The tag names the
      # crate version, the Minecraft version the package targets,
      # and the commit it was built from. The files ship as they
      # are, no archive; the checksum asset carries the SHA-256 of
      # the wasm file itself, which the client compares against its
      # downloaded copy — a different checksum means a new download.
      - name: Release the WebAssembly package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          MC_VERSION=$(sed -n 's/.*pub const VERSION: &str = "\(.*\)".*/\1/p' third_party/Client/pomme-client/src/viewer/steel.rs)
          TAG="v${VERSION}+mc${MC_VERSION}-$(git rev-parse --short HEAD)"
          echo "Releasing $TAG"
          sha256sum pkg/block_world_renderer.wasm | awk '{print $1}' > block_world_renderer.wasm.sha256
          mapfile -t ASSETS < <(find pkg -type f ! -name 'package.json' ! -name '.gitignore' ! -name '*.d.ts')
          ASSETS+=(block_world_renderer.wasm.sha256)
          printf 'Assets: %s\n' "${ASSETS[@]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install web dependencies
        run: nix develop -c pnpm --dir apps/web install --frozen-lockfile

      - name: Lint the web app
        run: nix develop -c pnpm --dir apps/web run lint

      - name: Type-check the web app
        run: nix develop -c pnpm --dir apps/web run typecheck

      - name: Build the web app
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: nix develop -c pnpm --dir apps/web run build

      # The built site, wasm included, is the whole content of the web
      # branch, which GitHub Pages serves.
      - name: Push the built site to the web branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd apps/web/out
          touch .nojekyll
          git init -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Built from ${GITHUB_SHA}"
          git push --force "${PUSH_URL}" web
