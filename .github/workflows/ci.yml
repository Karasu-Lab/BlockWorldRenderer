name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test and build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Lint
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: Test
        run: nix develop -c cargo test

      - name: Build for wasm32-unknown-unknown
        run: nix develop -c cargo build --release --target wasm32-unknown-unknown

      - name: Generate JavaScript bindings
        run: nix develop -c wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/block_world_renderer.wasm

      - name: Upload WebAssembly package
        uses: actions/upload-artifact@v4
        with:
          name: block-world-renderer-wasm
          path: pkg/
          if-no-files-found: error
