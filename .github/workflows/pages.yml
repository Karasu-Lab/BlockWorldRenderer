name: GitHub Pages

# Deploys the web app as the GitHub Pages demo. The app ships as plain
# static files under the project subpath; its service worker supplies the
# cross-origin isolation headers Pages cannot set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the web app and deploy it to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the WebAssembly package
        run: nix develop -c just web-wasm

      - name: Install web dependencies
        run: nix develop -c pnpm --dir apps/web install --frozen-lockfile

      - name: Build the web app as static files
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: nix develop -c pnpm --dir apps/web run build

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
